# Development infrastructure only. Week 7 adds the app itself.
# These credentials are for local development. Never reuse them anywhere real.
services:
  db:
    image: postgres:17
    container_name: taskflow-db # keeps scripts/check-migrations.sh working
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow
    ports:
      - "127.0.0.1:5432:5432" # localhost only: never publish a database on every interface
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    # noeviction: Redis never silently deletes data when memory is full (Day 38 stores jobs here),
    # so every key we write must have a TTL. appendonly keeps data across restarts.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
